name: MPV Infinity arm64 Debug APK

on:
  push:
    branches:
      - Mpv∞-flow
    paths-ignore:
      - .github/workflows/mpvflow-debug-arm64.yml
      - .github/workflows/mpv-lgpl-aar.yml
      - scripts/build-mpv-lgpl-aar.sh
      - scripts/verify-mpv-aar-lgpl.py
  workflow_dispatch:
    inputs:
      jelly_test:
        description: "Build the opt-in motion-aligned majority jelly test APK (not the regular runtime)"
        required: false
        type: boolean
        default: false
      jelly_preview:
        description: "Build a separate .debug APK with the confirmed dynamic mask and phase-smoothed Jelly blend"
        required: false
        type: boolean
        default: false
      jelly_probe:
        description: "Build a separate arm64 .debug.jelly-probe APK with opt-in one-shot report support"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mpvflow-debug-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64-debug:
    name: Build MPV Infinity arm64-v8a debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate diagnostic selection
        run: |
          selected=0
          for flag in "${{ inputs.jelly_test }}" "${{ inputs.jelly_preview }}" "${{ inputs.jelly_probe }}"; do
            if [[ "$flag" == "true" ]]; then selected=$((selected + 1)); fi
          done
          if (( selected > 1 )); then
            echo "Choose at most one of jelly_test, jelly_preview, or jelly_probe" >&2
            exit 1
          fi
      - name: Test persistent Jelly probe report delivery
        if: ${{ inputs.jelly_probe == true }}
        run: python3 scripts/tests/jelly_probe_report_delivery_test.py
      - name: Test native Jelly probe stage reports
        if: ${{ inputs.jelly_probe == true }}
        run: bash scripts/tests/run_mpvrx_jelly_probe_writer_test.sh
      - name: Test arm64 workflow cache and validation invariants
        run: python3 scripts/tests/mpvflow_arm64_workflow_test.py
      - name: Test experimental region3 attenuation invariants
        run: python3 scripts/tests/region3_transition_test.py
      - name: Test runtime AAR overlay accepts new shared libraries
        run: python3 scripts/tests/package_mpv_runtime_aar_test.py
      - name: Test complete MPVFlow focused invariants
        run: |
          python3 scripts/tests/mpvflow_flow_only_test.py
          python3 scripts/tests/mpvflow_native_build_test.py
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Restore verified Flow-only MPVFlow arm64 runtime
        id: mpvflow-runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: native-builder/app/build/outputs/apk
          key: >-
            ${{ inputs.jelly_probe == true && 'mpvflow-arm64-runtime-v7-jelly-probe-builder-1efc82739f6f7034' || 'mpvflow-arm64-runtime-v7-builder-1efc82739f6f7034' }}-mpv-fongmi-95ec8e929f8ad2f97c8415c486971493a0b408df-libplacebo-fongmi-63659d96d1bff7d7a5a1368e9538056a193fc6fb-ffmpeg-fongmi-f2c5162b7c4b3e8835de270ff78cecc524decad1-vulkan-headers-khronos-a4f8ada9f4f97c45b8c89c57997be9cebaae65d2-cores2-${{ inputs.jelly_probe == true && 'jelly-probe-' || inputs.jelly_preview == true && 'jelly-preview-' || inputs.jelly_test == true && 'jelly-test-' || 'baseline-' }}${{ hashFiles('scripts/build-mpvflow-mpv-runtime.sh', 'scripts/mpvrx_motion_source.py', 'scripts/patch_fongmi_motion_downsample.py', 'scripts/patch_fongmi_motion_jelly.py', 'scripts/prepare-mpvflow.py', 'scripts/prepare-mpvflow-vulkan-headers.py', 'scripts/patch-ffmpeg-symver.py', 'scripts/patches/mpvlibandroid-fongmi/**', 'app/src/main/cpp/**', 'THIRD_PARTY_LICENSES/**', 'app/src/main/assets/mpv/licenses/**') }}${{ inputs.jelly_probe == true && format('-{0}', hashFiles('scripts/patch_fongmi_motion_jelly_probe.py', 'scripts/patch_fongmi_vo_jelly_probe.py')) || '' }}
      - name: Checkout pinned Android MPV build tools
        if: ${{ steps.mpvflow-runtime-cache.outputs.cache-hit != 'true' }}
        uses: actions/checkout@v6
        with:
          repository: NihilDigit/mpv-android-anvil
          ref: 1efc82739f6f7034cd63e7ee8b3ec5431df27467
          path: native-builder
      - name: Checkout pinned MPV source
        uses: actions/checkout@v6
        with:
          repository: FongMi/mpv
          ref: 95ec8e929f8ad2f97c8415c486971493a0b408df
          path: mpv-source
      - name: Verify MPV Infinity motion source and 480px integration
        if: ${{ steps.mpvflow-runtime-cache.outputs.cache-hit != 'true' }}
        run: python3 scripts/tests/mpvrx_motion_source_test.py --mpv-dir mpv-source
      - name: Install Vulkan and shader validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils ffmpeg glslang-tools libvulkan-dev mesa-vulkan-drivers
      - name: Compile selected opt-in Jelly shader for MPV Infinity
        run: |
          args=(--mpv-dir mpv-source --require-glslang)
          if [[ "${{ inputs.jelly_preview }}" == "true" ]]; then args+=(--preview-only); fi
          python3 scripts/tests/mpvrx_motion_jelly_test.py "${args[@]}"
          if [[ "${{ inputs.jelly_probe }}" == "true" ]]; then
            python3 scripts/tests/mpvrx_motion_jelly_probe_test.py --mpv-dir mpv-source --require-glslang
            MPVRX_JELLY_PROBE_MPV_DIR=mpv-source python3 scripts/tests/fongmi_vo_jelly_probe_test.py
          fi
      - name: Run MPVFlow core and GPU shader regression tests
        run: ./scripts/test-mpvflow-core.sh
        env:
          MPVFLOW_REQUIRE_VULKAN_PIXEL_TEST: '1'
          MPVFLOW_MPV_SOURCE_DIR: mpv-source
      - name: Install Android MPV native build dependencies
        # Gradle still builds libass/Media3 on an MPV runtime cache hit.
        # Their autotools setup requires autopoint and the other host tools too.
        run: |
          sudo apt-get install -y autoconf automake libtool gettext autopoint gperf pkg-config ninja-build cmake pipx nasm yasm zlib1g-dev libssl-dev zip unzip wget curl
          pipx install meson==1.6.1
          PIPX_BIN_DIR="$(pipx environment --value PIPX_BIN_DIR)"
          echo "$PIPX_BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$PIPX_BIN_DIR:$PATH"
          "$PIPX_BIN_DIR/meson" --version
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Use cached Flow-only MPVFlow arm64 runtime
        if: ${{ steps.mpvflow-runtime-cache.outputs.cache-hit == 'true' }}
        run: |
          set -euo pipefail
          runtime_dir="$GITHUB_WORKSPACE/native-builder/app/build/outputs/apk"
          [[ -d "$runtime_dir" ]] || { echo "Cached MPVFlow runtime path is missing: $runtime_dir" >&2; exit 1; }
          apk="$(find "$runtime_dir" -type f -path '*/debug/*' -name '*arm64-v8a-debug*.apk' -print -quit)"
          [[ -n "$apk" ]] || { echo "Cached MPVFlow arm64 runtime APK is missing" >&2; exit 1; }
          echo "MPVFLOW_RUNTIME_APK=$apk" >> "$GITHUB_ENV"
          echo "Using verified cached MPVFlow runtime APK: $apk"
      - name: Build MPVFlow-only MPV native arm64 debug package
        if: ${{ steps.mpvflow-runtime-cache.outputs.cache-hit != 'true' }}
        run: ./scripts/build-mpvflow-mpv-runtime.sh
        env:
          MPVFLOW_MPV_BUILD_CORES: '2'
          MPVFLOW_MPVRX_ANALYSIS_DOWNSAMPLE_AA: '1'
          MPVFLOW_JELLY_EXPERIMENTAL: ${{ (inputs.jelly_test == true || inputs.jelly_probe == true) && '1' || '0' }}
          MPVFLOW_JELLY_PREVIEW: ${{ inputs.jelly_preview == true && '1' || '0' }}
          MPVFLOW_JELLY_PROBE: ${{ inputs.jelly_probe == true && '1' || '0' }}
      - name: Verify MPV Infinity motion source after preparation
        if: ${{ steps.mpvflow-runtime-cache.outputs.cache-hit != 'true' }}
        run: |
          args=(--mpv-dir native-builder/buildscripts/deps/mpv --require-analysis-downsample-aa)
          if [[ "${{ inputs.jelly_preview }}" == "true" ]]; then
            args+=(--require-jelly-preview)
          elif [[ "${{ inputs.jelly_probe }}" == "true" ]]; then
            args+=(--require-jelly-experimental --require-jelly-probe)
          elif [[ "${{ inputs.jelly_test }}" == "true" ]]; then
            args+=(--require-jelly-experimental)
          fi
          python3 scripts/tests/mpvrx_motion_source_test.py "${args[@]}"
      - name: Overlay MPVFlow MPV/FFmpeg arm64 runtime into MPV∞ AAR
        run: python3 scripts/package-mpv-runtime-aar.py --runtime-apk "$MPVFLOW_RUNTIME_APK" --mpv-aar app/libs/mpvlib.aar --abis arm64-v8a
      - name: Test Android NDK path resolver
        run: python3 scripts/tests/android_ndk_path_test.py
      - name: Test Media3 FFmpeg runtime verifier
        run: python3 scripts/tests/verify_media3_dca_runtime_test.py
      - name: Verify GPL-free MPVFlow arm64 runtime
        run: python3 scripts/verify-mpv-aar-lgpl.py app/libs/mpvlib.aar --abis arm64-v8a --require-vulkan
      - name: Verify LGPL-only DTS decoder runtime for Media3
        run: python3 scripts/verify-media3-dca-runtime.py app/libs/mpvlib.aar --abis arm64-v8a
      - name: Save verified Flow-only MPVFlow arm64 runtime
        if: ${{ steps.mpvflow-runtime-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: native-builder/app/build/outputs/apk
          key: ${{ steps.mpvflow-runtime-cache.outputs.cache-primary-key }}
      - name: Run Kotlin unit tests before APK packaging
        run: |
          set -euo pipefail
          # AGP 9 creates unit-test components only for the tested build type (debug) by default.
          # JellyProbe is an APK-only diagnostic variant; use the available StandardDebug tests.
          tasks=(:app:testStandardDebugUnitTest :media3-decoder-ffmpeg:testDebugUnitTest)
          ./gradlew "${tasks[@]}" -PtargetAbi=arm64-v8a -PmpvFlowMpvBuild=true ${{ inputs.jelly_probe == true && '-PmpvFlowJellyProbe=true' || '' }} --stacktrace --no-daemon --max-workers=2
      - name: Assemble one arm64-v8a diagnostic APK after Kotlin checks
        run: ./gradlew "assembleStandard${{ inputs.jelly_probe == true && 'JellyProbe' || inputs.jelly_preview == true && 'JellyPreview' || 'Debug' }}" -PtargetAbi=arm64-v8a -PmpvFlowMpvBuild=true ${{ inputs.jelly_probe == true && '-PmpvFlowJellyProbe=true' || '' }} --stacktrace --no-daemon --max-workers=2
      - name: Verify arm64 DTS wrapper dynamically links the existing FFmpeg runtime
        run: |
          set -euo pipefail
          apk_dir="app/build/outputs/apk/standard/${{ inputs.jelly_probe == true && 'jellyProbe' || inputs.jelly_preview == true && 'jellyPreview' || 'debug' }}"
          mapfile -t apks < <(find "$apk_dir" -maxdepth 1 -type f -name '*.apk' -print)
          [[ "${#apks[@]}" -eq 1 ]] || { echo "Expected exactly one Standard arm64 APK in $apk_dir; found ${#apks[@]}" >&2; exit 1; }
          apk="${apks[0]}"
          [[ "$apk" == *arm64-v8a* ]] || { echo "APK filename does not identify the arm64-v8a output: $apk" >&2; exit 1; }
          python3 scripts/verify-media3-dca-apk.py "$apk"
          python3 scripts/verify-region3-shader-apk.py "$apk"
          python3 scripts/verify-pair-ghost-apk.py "$apk"
          if [[ "${{ inputs.jelly_probe }}" == "true" ]]; then
            [[ "$apk" == *jellyProbe* ]] || { echo "Diagnostic APK filename missing jellyProbe: $apk" >&2; exit 1; }
            sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
            aapt="$(find "$sdk_root/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt -print | sort -V | tail -n 1)"
            [[ -n "$aapt" ]] || { echo "Android SDK aapt is unavailable" >&2; exit 1; }
            "$aapt" dump badging "$apk" | grep -F "package: name='app.infinity.mpvz.debug.jellyprobe'" >/dev/null
          fi
      - name: Upload single arm64-v8a diagnostic APK
        uses: actions/upload-artifact@v7
        with:
          name: mpv-infinity-arm64-v8a-${{ inputs.jelly_probe == true && 'jelly-probe' || inputs.jelly_preview == true && 'jelly-blend-test' || inputs.jelly_test == true && 'jelly-test' || 'debug' }}-${{ github.sha }}
          path: app/build/outputs/apk/standard/${{ inputs.jelly_probe == true && 'jellyProbe' || inputs.jelly_preview == true && 'jellyPreview' || 'debug' }}/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
