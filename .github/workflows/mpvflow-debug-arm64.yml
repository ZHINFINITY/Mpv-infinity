name: MPVFlow MPVRx FongMi arm64 Debug APK

on:
  push:
    branches:
      - Mpv∞-flow
    paths-ignore:
      - .github/workflows/mpvflow-debug-arm64.yml
      - .github/workflows/mpv-lgpl-aar.yml
      - scripts/build-mpv-lgpl-aar.sh
      - scripts/verify-mpv-aar-lgpl.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mpvflow-debug-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64-debug:
    name: Build MPVFlow MPVRx arm64-v8a debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Test arm64 workflow cache and validation invariants
        run: python3 scripts/tests/mpvflow_arm64_workflow_test.py
      - name: Test experimental region3 attenuation invariants
        run: python3 scripts/tests/region3_transition_test.py
      - name: Test runtime AAR overlay accepts new shared libraries
        run: python3 scripts/tests/package_mpv_runtime_aar_test.py
      - name: Test complete MPVFlow focused invariants
        run: |
          python3 scripts/tests/mpvflow_flow_only_test.py
          python3 scripts/tests/mpvflow_native_build_test.py
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Restore verified Flow-only MPVFlow arm64 runtime
        id: mpvflow-runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: native-builder/app/build/outputs/apk
          key: mpvflow-arm64-runtime-v7-builder-1efc82739f6f7034-mpv-fongmi-95ec8e929f8ad2f97c8415c486971493a0b408df-libplacebo-fongmi-63659d96d1bff7d7a5a1368e9538056a193fc6fb-ffmpeg-fongmi-f2c5162b7c4b3e8835de270ff78cecc524decad1-vulkan-headers-khronos-a4f8ada9f4f97c45b8c89c57997be9cebaae65d2-cores2-${{ hashFiles('scripts/build-mpvflow-mpv-runtime.sh', 'scripts/mpvrx_motion_source.py', 'scripts/patch_fongmi_motion_downsample.py', 'scripts/prepare-mpvflow.py', 'scripts/prepare-mpvflow-vulkan-headers.py', 'scripts/patch-ffmpeg-symver.py', 'scripts/patches/mpvlibandroid-fongmi/**', 'app/src/main/cpp/**', 'THIRD_PARTY_LICENSES/**', 'app/src/main/assets/mpv/licenses/**') }}
      - name: Checkout pinned Android MPV build tools
        if: ${{ steps.mpvflow-runtime-cache.outputs.cache-hit != 'true' }}
        uses: actions/checkout@v6
        with:
          repository: NihilDigit/mpv-android-anvil
          ref: 1efc82739f6f7034cd63e7ee8b3ec5431df27467
          path: native-builder
      - name: Checkout pinned MPV source
        if: ${{ steps.mpvflow-runtime-cache.outputs.cache-hit != 'true' }}
        uses: actions/checkout@v6
        with:
          repository: FongMi/mpv
          ref: 95ec8e929f8ad2f97c8415c486971493a0b408df
          path: mpv-source
      - name: Verify exact MPVRx FongMi motion source and 480px integration
        if: ${{ steps.mpvflow-runtime-cache.outputs.cache-hit != 'true' }}
        run: python3 scripts/tests/mpvrx_motion_source_test.py --mpv-dir mpv-source
      - name: Install Vulkan and shader validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils ffmpeg glslang-tools libvulkan-dev mesa-vulkan-drivers
      - name: Run MPVFlow core and GPU shader regression tests
        run: ./scripts/test-mpvflow-core.sh
        env:
          MPVFLOW_REQUIRE_VULKAN_PIXEL_TEST: '1'
          MPVFLOW_MPV_SOURCE_DIR: mpv-source
      - name: Install Android MPV native build dependencies
        # Gradle still builds libass/Media3 on an MPV runtime cache hit.
        # Their autotools setup requires autopoint and the other host tools too.
        run: |
          sudo apt-get install -y autoconf automake libtool gettext autopoint gperf pkg-config ninja-build cmake pipx nasm yasm zlib1g-dev libssl-dev zip unzip wget curl
          pipx install meson==1.6.1
          PIPX_BIN_DIR="$(pipx environment --value PIPX_BIN_DIR)"
          echo "$PIPX_BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$PIPX_BIN_DIR:$PATH"
          "$PIPX_BIN_DIR/meson" --version
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Use cached Flow-only MPVFlow arm64 runtime
        if: ${{ steps.mpvflow-runtime-cache.outputs.cache-hit == 'true' }}
        run: |
          set -euo pipefail
          runtime_dir="$GITHUB_WORKSPACE/native-builder/app/build/outputs/apk"
          [[ -d "$runtime_dir" ]] || { echo "Cached MPVFlow runtime path is missing: $runtime_dir" >&2; exit 1; }
          apk="$(find "$runtime_dir" -type f -path '*/debug/*' -name '*arm64-v8a-debug*.apk' -print -quit)"
          [[ -n "$apk" ]] || { echo "Cached MPVFlow arm64 runtime APK is missing" >&2; exit 1; }
          echo "MPVFLOW_RUNTIME_APK=$apk" >> "$GITHUB_ENV"
          echo "Using verified cached MPVFlow runtime APK: $apk"
      - name: Build MPVFlow-only MPV native arm64 debug package
        if: ${{ steps.mpvflow-runtime-cache.outputs.cache-hit != 'true' }}
        run: ./scripts/build-mpvflow-mpv-runtime.sh
        env:
          MPVFLOW_MPV_BUILD_CORES: '2'
          MPVFLOW_MPVRX_ANALYSIS_DOWNSAMPLE_AA: '1'
      - name: Verify MPVRx FongMi motion source after preparation
        if: ${{ steps.mpvflow-runtime-cache.outputs.cache-hit != 'true' }}
        run: python3 scripts/tests/mpvrx_motion_source_test.py --mpv-dir native-builder/buildscripts/deps/mpv --require-analysis-downsample-aa
      - name: Overlay MPVFlow MPV/FFmpeg arm64 runtime into MPV∞ AAR
        run: python3 scripts/package-mpv-runtime-aar.py --runtime-apk "$MPVFLOW_RUNTIME_APK" --mpv-aar app/libs/mpvlib.aar --abis arm64-v8a
      - name: Test Android NDK path resolver
        run: python3 scripts/tests/android_ndk_path_test.py
      - name: Test Media3 FFmpeg runtime verifier
        run: python3 scripts/tests/verify_media3_dca_runtime_test.py
      - name: Verify GPL-free MPVFlow arm64 runtime
        run: python3 scripts/verify-mpv-aar-lgpl.py app/libs/mpvlib.aar --abis arm64-v8a --require-vulkan
      - name: Verify LGPL-only DTS decoder runtime for Media3
        run: python3 scripts/verify-media3-dca-runtime.py app/libs/mpvlib.aar --abis arm64-v8a
      - name: Save verified Flow-only MPVFlow arm64 runtime
        if: ${{ steps.mpvflow-runtime-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: native-builder/app/build/outputs/apk
          key: ${{ steps.mpvflow-runtime-cache.outputs.cache-primary-key }}
      - name: Run complete Kotlin compile and unit tests before APK packaging
        run: ./gradlew testStandardDebugUnitTest :media3-decoder-ffmpeg:testDebugUnitTest :app:compileStandardDebugKotlin -PtargetAbi=arm64-v8a -PmpvFlowMpvBuild=true --stacktrace --no-daemon --max-workers=2
      - name: Assemble arm64-v8a debug APK after Kotlin checks
        run: ./gradlew assembleStandardDebug -PtargetAbi=arm64-v8a -PmpvFlowMpvBuild=true --stacktrace --no-daemon --max-workers=2
      - name: Verify arm64 DTS wrapper dynamically links the existing FFmpeg runtime
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/standard/debug -maxdepth 1 -type f -name '*arm64-v8a-debug*.apk' -print -quit)"
          [[ -n "$apk" ]] || { echo "Standard arm64 debug APK was not produced" >&2; exit 1; }
          python3 scripts/verify-media3-dca-apk.py "$apk"
          python3 scripts/verify-region3-shader-apk.py "$apk"
          python3 scripts/verify-pair-ghost-apk.py "$apk"
      - name: Upload arm64-v8a debug APK
        uses: actions/upload-artifact@v7
        with:
          name: mpv-infinity-mpvrx-fongmi-arm64-v8a-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/standard/debug/*arm64-v8a-debug*.apk
            app/build/outputs/apk/standard/debug/region3-shader-verification.json
            app/build/outputs/apk/standard/debug/pair-ghost-verification.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
