name: MPVFlow arm64 Debug APK

on:
  push:
    branches:
      - Mpv∞-flow
    paths-ignore:
      - .github/workflows/mpvflow-debug-arm64.yml
      - .github/workflows/mpv-lgpl-aar.yml
      - scripts/build-mpv-lgpl-aar.sh
      - scripts/verify-mpv-aar-lgpl.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mpvflow-debug-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64-debug:
    name: Build MPVFlow-only MPV∞ arm64-v8a debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Test runtime AAR overlay accepts new shared libraries
        run: python3 scripts/tests/package_mpv_runtime_aar_test.py
      - name: Checkout pinned Android MPV build tools
        uses: actions/checkout@v6
        with:
          repository: NihilDigit/mpv-android-anvil
          ref: 1efc82739f6f7034cd63e7ee8b3ec5431df27467
          path: native-builder
      - name: Checkout pinned MPV source
        uses: actions/checkout@v6
        with:
          repository: mpv-player/mpv
          ref: c1529642089bfebfc928a1c1664638a7a5d219ba
          path: mpv-source
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android MPV native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool gettext autopoint gperf pkg-config ninja-build cmake pipx nasm yasm binutils zlib1g-dev libssl-dev zip unzip wget curl ffmpeg glslang-tools libvulkan-dev mesa-vulkan-drivers
          pipx install meson==1.6.1
          PIPX_BIN_DIR="$(pipx environment --value PIPX_BIN_DIR)"
          echo "$PIPX_BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$PIPX_BIN_DIR:$PATH"
          "$PIPX_BIN_DIR/meson" --version
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build MPVFlow-only MPV native arm64 debug package
        run: ./scripts/build-mpvflow-mpv-runtime.sh
        env:
          MPVFLOW_MPV_BUILD_CORES: '2'
      - name: Overlay MPVFlow MPV/FFmpeg arm64 runtime into MPV∞ AAR
        run: python3 scripts/package-mpv-runtime-aar.py --runtime-apk "$MPVFLOW_RUNTIME_APK" --mpv-aar app/libs/mpvlib.aar --abis arm64-v8a
      - name: Verify GPL-free MPVFlow arm64 runtime
        run: python3 scripts/verify-mpv-aar-lgpl.py app/libs/mpvlib.aar --abis arm64-v8a --require-vulkan
      - name: Run MPVFlow core and GPU shader regression tests
        run: ./scripts/test-mpvflow-core.sh
        env:
          MPVFLOW_REQUIRE_VULKAN_PIXEL_TEST: '1'
      - name: Run standard arm64 debug unit tests
        run: ./gradlew testStandardDebugUnitTest -PtargetAbi=arm64-v8a -PmpvFlowMpvBuild=true --stacktrace --no-daemon --max-workers=2
      - name: Build arm64-v8a debug APK
        run: ./gradlew assembleStandardDebug -PtargetAbi=arm64-v8a -PmpvFlowMpvBuild=true --stacktrace --no-daemon --max-workers=2
      - name: Upload arm64-v8a debug APK
        uses: actions/upload-artifact@v7
        with:
          name: mpv-infinity-mpvflow-arm64-v8a-debug-${{ github.sha }}
          path: app/build/outputs/apk/standard/debug/*arm64-v8a-debug*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
