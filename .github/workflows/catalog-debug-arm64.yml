name: Catalog arm64 Debug APK

on:
  push:
    branches:
      - fix/native-local-direct-source-4ef92fe
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-debug-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64-debug:
    name: Build standard arm64-v8a debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build arm64-v8a debug APK
        run: ./gradlew assembleStandardDebug -PtargetAbi=arm64-v8a --stacktrace --no-daemon --max-workers=2
      - name: Upload arm64-v8a debug APK
        uses: actions/upload-artifact@v7
        with:
          name: mpv-infinity-standard-arm64-v8a-debug-${{ github.sha }}
          path: app/build/outputs/apk/standard/debug/*arm64-v8a-debug*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
