name: RIFE arm64 Debug APK

on:
  push:
    branches:
      - fix/native-local-direct-source-4ef92fe
      - experimental-features
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-debug-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64-debug:
    name: Build RIFE MPV∞ arm64-v8a debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Checkout pinned Android MPV build tools
        uses: actions/checkout@v6
        with:
          repository: NihilDigit/mpv-android-anvil
          ref: 1efc82739f6f7034cd63e7ee8b3ec5431df27467
          path: native-builder
      - name: Checkout pinned MPV source
        uses: actions/checkout@v6
        with:
          repository: mpv-player/mpv
          ref: c1529642089bfebfc928a1c1664638a7a5d219ba
          path: mpv-source
      - name: Checkout pinned libplacebo host-test source
        uses: actions/checkout@v6
        with:
          repository: haasn/libplacebo
          ref: 0d043c7f6f79cd3687c023454bdacbe615e4d96f
          path: libplacebo-source
      - name: Check RIFE resident VO patch against pinned MPV
        working-directory: mpv-source
        run: |
          git apply --check ../scripts/patches/rife-resident-vo.patch
          git apply ../scripts/patches/rife-resident-vo.patch
          python3 ../scripts/tests/test_rife_resident_contract.py \
            --mpv-source . \
            --native-bridge ../app/src/main/cpp/rife/rife_vfi_bridge.cpp
      - name: Checkout pinned RIFE-ncnn-vulkan source and model
        uses: actions/checkout@v6
        with:
          repository: nihui/rife-ncnn-vulkan
          ref: a7532fc3f9f8f008cd6eecd6f2ffe2a9698e0cf7
          path: rife-project
          submodules: recursive
          sparse-checkout: |
            src
            models/rife-v4.6
            LICENSE
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android MPV native build dependencies
        run: |
          # Avoid the intermittently unresponsive Azure HTTP mirror on hosted runners.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          APT_OPTIONS=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${APT_OPTIONS[@]}" update
          sudo apt-get "${APT_OPTIONS[@]}" install -y autoconf automake libtool gettext autopoint gperf pkg-config ninja-build pipx nasm yasm binutils zlib1g-dev libssl-dev zip unzip wget curl ffmpeg glslang-tools libvulkan-dev build-essential python3-dev libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libass-dev
          pipx install meson==1.6.1
          pipx inject meson jinja2==3.1.6
          export PATH="$HOME/.local/bin:$PATH"
          meson --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run pinned libmpv option-registration runtime test
        run: bash ./scripts/test-rife-mpv-options-runtime.sh ./mpv-source ./libplacebo-source
      - name: Compile RIFE Vulkan conversion shaders
        run: bash ./scripts/test-rife-vulkan-shaders.sh
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Run RIFE cadence regression tests
        run: ./scripts/test-rife-cadence.sh
      - name: Run RIFE FP16 capability policy tests
        run: ./scripts/test-rife-fp16-policy.sh
      - name: Run RIFE Vulkan VkMat layout policy tests
        run: ./scripts/test-rife-vulkan-layout.sh
      - name: Run RIFE Vulkan output layout policy tests
        run: bash ./scripts/test-rife-vulkan-output-layout.sh
      - name: Run RIFE AHardwareBuffer fail-closed policy tests
        run: bash ./scripts/test-rife-ahb-policy.sh
      - name: Check RIFE Vulkan API 26-safe dispatch
        run: bash ./scripts/test-rife-vulkan-dispatch.sh
      - name: Compile generated RIFE Vulkan input guard
        run: python3 ./scripts/tests/test_rife_vulkan_guard.py
      - name: Run standard debug unit tests before native build
        run: ./gradlew testStandardDebugUnitTest -PtargetAbi=arm64-v8a -PrifeNativeBuild=true --stacktrace --no-daemon --max-workers=2
      - name: Build RIFE + MPV native arm64 debug package
        run: ./scripts/build-rife-mpv-runtime.sh
        env:
          RIFE_MPV_BUILD_CORES: '2'
      - name: Overlay RIFE MPV/FFmpeg arm64 runtime into MPV∞ AAR
        run: python3 scripts/package-mpv-runtime-aar.py --runtime-apk "$RIFE_RUNTIME_APK" --mpv-aar app/libs/mpvlib.aar
      - name: Build arm64-v8a debug APK
        run: ./gradlew assembleStandardDebug -PtargetAbi=arm64-v8a -PrifeNativeBuild=true --stacktrace --no-daemon --max-workers=2
      - name: Verify final app APK contains patched RIFE libmpv
        run: |
          apk="$(find app/build/outputs/apk/standard/debug -maxdepth 1 -type f -name '*arm64-v8a-debug*.apk' -print -quit)"
          test -n "$apk"
          python3 scripts/tests/test_rife_android_mpv_artifact.py --apk "$apk"
      - name: Upload arm64-v8a debug APK
        uses: actions/upload-artifact@v7
        with:
          name: mpv-infinity-rife-arm64-v8a-debug-${{ github.sha }}
          path: app/build/outputs/apk/standard/debug/*arm64-v8a-debug*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
