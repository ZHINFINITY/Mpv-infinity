name: Make release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag to release (for example v2.1.0)
        required: true
        type: string
      draft:
        description: Create the release as a draft (not published)
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release-for-github:
    name: Release for GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install native subtitle build dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool gettext autopoint gperf pkg-config

      - name: Verify native subtitle build tools
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/bin:/usr/local/bin:$PATH"
          autopoint --version
          autoreconf --version
          echo "/usr/bin" >> "$GITHUB_PATH"

      - name: Resolve and validate release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version_tag="${GITHUB_REF#refs/tags/}"
          else
            version_tag="${{ inputs.tag_name }}"
          fi

          if [[ ! "$version_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid stable release tag: $version_tag"
            exit 1
          fi
          if tag_commit="$(git rev-parse --verify --quiet "refs/tags/${version_tag}^{commit}")"; then
            checkout_commit="$(git rev-parse HEAD)"
            if [[ "$tag_commit" != "$checkout_commit" ]]; then
              echo "Release tag $version_tag does not point to the checkout commit"
              exit 1
            fi
          fi
          echo "VERSION_TAG=$version_tag" >> "$GITHUB_ENV"
          echo "version_tag=$version_tag" >> "$GITHUB_OUTPUT"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify LGPL-only MPV runtimes
        run: |
          python3 scripts/verify-mpv-aar-lgpl.py app/libs/mpvlib.aar --abis arm64-v8a,armeabi-v7a,x86,x86_64 --only-selected-abis --require-vulkan
          python3 scripts/verify-mpv-aar-lgpl.py app/libs/mpvlib-no-vulkun.aar --abis arm64-v8a,armeabi-v7a,x86,x86_64 --only-selected-abis --forbid-vulkan

      - name: Build selected release APKs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleStandardRelease --stacktrace --no-daemon --max-workers=2
          ./gradlew assembleNoVulkanRelease --stacktrace --no-daemon --max-workers=2

      # The Standard arm64-v8a release ships the same Flow-only MPVFlow runtime as the
      # tested arm64 debug builds, so MPV-engine frame interpolation is available.
      # Other ABIs and non-Vulkan builds keep the stock runtime (built above).
      - name: Keep stock multi-ABI Standard release outputs
        shell: bash
        run: |
          set -euo pipefail
          release_dir="app/build/outputs/apk/standard/release"
          mkdir -p "$RUNNER_TEMP/standard-stock"
          cp "$release_dir"/*.apk "$RUNNER_TEMP/standard-stock/"
          rm -f "$RUNNER_TEMP/standard-stock/app-standard-arm64-v8a-release-unsigned.apk"
          ls -1 "$RUNNER_TEMP/standard-stock"

      - name: Restore verified Flow-only MPVFlow arm64 runtime
        id: mpvflow-runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: native-builder/app/build/outputs/apk
          key: mpvflow-arm64-runtime-v2-builder-1efc82739f6f7034-mpv-c1529642089bfebf-cores2-${{ hashFiles('scripts/build-mpvflow-mpv-runtime.sh', 'scripts/prepare-mpvflow.py', 'scripts/patch-ffmpeg-symver.py', 'app/src/main/cpp/**', 'THIRD_PARTY_LICENSES/**', 'app/src/main/assets/mpv/licenses/**') }}

      - name: Checkout pinned Android MPV build tools
        if: ${{ steps.mpvflow-runtime-cache.outputs.cache-hit != 'true' }}
        uses: actions/checkout@v6
        with:
          repository: NihilDigit/mpv-android-anvil
          ref: 1efc82739f6f7034cd63e7ee8b3ec5431df27467
          path: native-builder

      - name: Checkout pinned MPV source
        if: ${{ steps.mpvflow-runtime-cache.outputs.cache-hit != 'true' }}
        uses: actions/checkout@v6
        with:
          repository: mpv-player/mpv
          ref: c1529642089bfebfc928a1c1664638a7a5d219ba
          path: mpv-source

      - name: Install native interpolation build dependencies
        if: ${{ steps.mpvflow-runtime-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mpv-native-apt-archives"
          sudo install -d -m0755 -o _apt -g root "$RUNNER_TEMP/mpv-native-apt-archives/partial"
          scripts/ci/apt-install-with-fallback.sh \
            ninja-build cmake pipx nasm yasm binutils zlib1g-dev libssl-dev zip unzip wget curl ffmpeg glslang-tools libvulkan-dev mesa-vulkan-drivers
          pipx install meson==1.6.1
          echo "$(pipx environment --value PIPX_BIN_DIR)" >> "$GITHUB_PATH"

      - name: Build Flow-only MPVFlow arm64 runtime
        if: ${{ steps.mpvflow-runtime-cache.outputs.cache-hit != 'true' }}
        run: ./scripts/build-mpvflow-mpv-runtime.sh
        env:
          MPVFLOW_MPV_BUILD_CORES: '2'

      - name: Overlay Flow-only runtime and build Standard arm64-v8a release
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$GITHUB_WORKSPACE/native-builder/app/build/outputs/apk"
          apk="$(find "$runtime_dir" -type f -path '*/debug/*' -name '*arm64-v8a-debug*.apk' -print -quit)"
          [[ -n "$apk" ]] || { echo "MPVFlow arm64 runtime APK is missing" >&2; exit 1; }
          python3 scripts/package-mpv-runtime-aar.py --runtime-apk "$apk" --mpv-aar app/libs/mpvlib.aar --abis arm64-v8a
          python3 scripts/verify-mpv-aar-lgpl.py app/libs/mpvlib.aar --abis arm64-v8a,armeabi-v7a,x86,x86_64 --require-vulkan
          ./gradlew assembleStandardRelease -PtargetAbi=arm64-v8a -PmpvFlowMpvBuild=true --stacktrace --no-daemon --max-workers=2
          release_dir="app/build/outputs/apk/standard/release"
          flow_apk="$release_dir/app-standard-arm64-v8a-release-unsigned.apk"
          test -f "$flow_apk"
          entries="$(unzip -Z1 "$flow_apk")"
          for library in libmpv.so libplayer.so libplacebo.so libudfread.so libmedia3flow_vulkan.so; do
            grep -Fx "lib/arm64-v8a/$library" <<< "$entries" >/dev/null || { echo "Flow arm64 release APK is missing $library" >&2; exit 1; }
          done
          if grep -E '^lib/[^/]+/librife_vfi\.so$' <<< "$entries" >/dev/null; then
            echo "RIFE native library unexpectedly present" >&2; exit 1
          fi
          if grep -Ev '^lib/arm64-v8a/' <<< "$entries" | grep -E '^lib/' >/dev/null; then
            echo "Flow arm64 release APK contains non-arm64 native libraries" >&2; exit 1
          fi
          cp "$RUNNER_TEMP/standard-stock/"*.apk "$release_dir/"
          ls -1 "$release_dir"
          echo "Standard arm64-v8a release built with the Flow-only MPVFlow runtime."

      - name: Sign and verify release APKs
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"

          if [[ -z "${{ secrets.SIGNING_KEYSTORE }}" || -z "${{ secrets.SIGNING_KEY_ALIAS }}" || -z "${{ secrets.SIGNING_STORE_PASSWORD }}" || -z "${{ secrets.KEY_PASSWORD }}" ]]; then
            echo "Stable releases require all signing secrets."
            exit 1
          fi
          test -x "$apksigner"

          printf '%s' "${{ secrets.SIGNING_KEYSTORE }}" | base64 --decode > release.keystore
          trap 'rm -f release.keystore' EXIT

          sign_apk() {
            local unsigned="$1"
            local signed="$2"
            local label="$3"
            if [[ ! -f "$unsigned" ]]; then
              echo "Missing expected $label APK: $unsigned"
              find app/build/outputs/apk -type f -name '*.apk' -print || true
              exit 1
            fi

            "$apksigner" sign \
              --ks release.keystore \
              --ks-key-alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
              --ks-pass "pass:${{ secrets.SIGNING_STORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              --out "$signed" \
              "$unsigned"
            "$apksigner" verify --verbose "$signed"
            rm -f "$unsigned"
          }

          release_dir="app/build/outputs/apk/standard/release"
          test -d "$release_dir"
          architectures=(universal arm64-v8a armeabi-v7a x86 x86_64)
          for abi in "${architectures[@]}"; do
            sign_apk \
              "$release_dir/app-standard-${abi}-release-unsigned.apk" \
              "$release_dir/app-standard-${abi}-release.apk" \
              "standard $abi release"
          done

          flavor_dir="app/build/outputs/apk/noVulkan/release"
          test -d "$flavor_dir"
          sign_apk \
            "$flavor_dir/app-noVulkan-universal-release-unsigned.apk" \
            "$flavor_dir/app-noVulkan-universal-release.apk" \
            "non-Vulkan universal release"
          sign_apk \
            "$flavor_dir/app-noVulkan-arm64-v8a-release-unsigned.apk" \
            "$flavor_dir/app-noVulkan-arm64-v8a-release.apk" \
            "non-Vulkan arm64-v8a release"

      - name: Stage release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          : > checksums.txt

          release_dir="app/build/outputs/apk/standard/release"
          architectures=(universal arm64-v8a armeabi-v7a x86 x86_64)
          for abi in "${architectures[@]}"; do
            src="$release_dir/app-standard-${abi}-release.apk"
            dst="release-assets/Mpv∞-${abi}-${VERSION_TAG}.apk"
            test -f "$src"
            cp "$src" "$dst"
            sha256sum "$dst" | tee -a checksums.txt
          done

          src="app/build/outputs/apk/noVulkan/release/app-noVulkan-universal-release.apk"
          dst="release-assets/Mpv∞-no-vulkan-${VERSION_TAG}.apk"
          test -f "$src"
          cp "$src" "$dst"
          sha256sum "$dst" | tee -a checksums.txt

          src="app/build/outputs/apk/noVulkan/release/app-noVulkan-arm64-v8a-release.apk"
          dst="release-assets/Mpv∞-no-vulkan-arm64-v8a-${VERSION_TAG}.apk"
          test -f "$src"
          cp "$src" "$dst"
          sha256sum "$dst" | tee -a checksums.txt

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8').splitlines()
          section = []
          in_latest = False
          for line in changelog:
              if line.startswith('## '):
                  if in_latest:
                      break
                  in_latest = True
              if in_latest:
                  section.append(line)

          latest = '\n'.join(section).strip()
          if not latest:
              raise SystemExit('Could not find latest changelog section')
          Path('release-notes.md').write_text(latest + '\n', encoding='utf-8')
          PY

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.version_tag }}
          name: Mpv ∞ ${{ steps.release_tag.outputs.version_tag }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          generate_release_notes: false
          draft: ${{ inputs.draft == true }}
          prerelease: false
          fail_on_unmatched_files: true
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
