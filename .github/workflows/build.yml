name: CI/CD Build

on:
  push:
    branches:
      - master
      - fix/native-local-direct-source-4ef92fe
  pull_request:
  workflow_dispatch:
    inputs:
      build_flavor:
        description: APK flavor to build
        required: true
        default: standard
        type: choice
        options:
          - standard
          - all
          - no_vulkan

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SELECTED_FLAVOR: ${{ inputs.build_flavor || 'standard' }}
  ARM64_ONLY: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/fix/native-local-direct-source-4ef92fe' || github.ref == 'refs/heads/hotfix/v2.2.1-player-restore' }}
  OVERLAY_MPVFLOW_ARM64: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/hotfix/v2.2.1-player-restore' }}

jobs:
  build:
    name: Build selected APK flavors
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # BuildConfig.GIT_COUNT and preview build identities rely on the real repository history.
          fetch-depth: 0

      - name: Test licence notices and promotion regressions
        run: |
          python3 scripts/tests/project_license_test.py
          python3 scripts/tests/permission_only_license_test.py
          python3 scripts/tests/third_party_source_test.py
          python3 scripts/tests/media3_decoder_ffmpeg_variant_test.py
          python3 scripts/tests/mpvflow_pair_ghost_runner_test.py

      - name: Generate build metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "COMMIT_COUNT=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install native subtitle build dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool gettext autopoint gperf pkg-config

      - name: Verify native subtitle build tools
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/bin:/usr/local/bin:$PATH"
          autopoint --version
          autoreconf --version
          echo "/usr/bin" >> "$GITHUB_PATH"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Test download validator migration
        run: python3 scripts/tests/download_validator_migration_test.py

      - name: Run Standard debug JVM regression tests
        run: ./gradlew :app:testStandardDebugUnitTest -PtargetAbi=arm64-v8a --stacktrace --no-daemon --max-workers=2

      - name: Upload download validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: download-validator-evidence
          path: |
            app/schemas/**/23.json
            app/build/test-results/testStandardDebugUnitTest/*.xml
          if-no-files-found: warn

      - name: Verify LGPL-only MPV runtimes
        run: |
          python3 scripts/verify-mpv-aar-lgpl.py app/libs/mpvlib.aar --abis arm64-v8a,armeabi-v7a,x86,x86_64 --only-selected-abis --require-vulkan
          python3 scripts/verify-mpv-aar-lgpl.py app/libs/mpvlib-no-vulkun.aar --abis arm64-v8a,armeabi-v7a,x86,x86_64 --only-selected-abis --forbid-vulkan

      - name: Build selected release APKs
        shell: bash
        run: |
          set -euo pipefail
          gradle_abi_args=()
          if [[ "$ARM64_ONLY" == "true" ]]; then gradle_abi_args=(-PtargetAbi=arm64-v8a); fi
          if [[ "$SELECTED_FLAVOR" == "all" || "$SELECTED_FLAVOR" == "standard" ]]; then
            ./gradlew assembleStandardRelease "${gradle_abi_args[@]}" --stacktrace --no-daemon --max-workers=2
          fi
          if [[ "$SELECTED_FLAVOR" == "all" || "$SELECTED_FLAVOR" == "no_vulkan" ]]; then
            ./gradlew assembleNoVulkanRelease --stacktrace --no-daemon --max-workers=2
          fi

      - name: Restore verified Flow-only MPVFlow arm64 runtime
        if: ${{ env.OVERLAY_MPVFLOW_ARM64 == 'true' && (env.SELECTED_FLAVOR == 'all' || env.SELECTED_FLAVOR == 'standard') }}
        id: mpvflow-runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: native-builder/app/build/outputs/apk
          key: mpvflow-arm64-runtime-v2-builder-1efc82739f6f7034-mpv-c1529642089bfebf-cores2-${{ hashFiles('scripts/build-mpvflow-mpv-runtime.sh', 'scripts/prepare-mpvflow.py', 'scripts/patch-ffmpeg-symver.py', 'app/src/main/cpp/**', 'THIRD_PARTY_LICENSES/**', 'app/src/main/assets/mpv/licenses/**') }}

      - name: Overlay Flow-only runtime and rebuild Standard arm64-v8a release
        if: ${{ env.OVERLAY_MPVFLOW_ARM64 == 'true' && (env.SELECTED_FLAVOR == 'all' || env.SELECTED_FLAVOR == 'standard') }}
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$GITHUB_WORKSPACE/native-builder/app/build/outputs/apk"
          apk="$(find "$runtime_dir" -type f -path '*/debug/*' -name '*arm64-v8a-debug*.apk' -print -quit)"
          [[ -n "$apk" ]] || { echo "Cached MPVFlow arm64 runtime APK is missing" >&2; exit 1; }
          python3 scripts/package-mpv-runtime-aar.py --runtime-apk "$apk" --mpv-aar app/libs/mpvlib.aar --abis arm64-v8a
          python3 scripts/verify-mpv-aar-lgpl.py app/libs/mpvlib.aar --abis arm64-v8a --require-vulkan --require-mpvflow
          ./gradlew assembleStandardRelease -PtargetAbi=arm64-v8a -PmpvFlowMpvBuild=true --stacktrace --no-daemon --max-workers=2
          flow_apk="app/build/outputs/apk/standard/release/app-standard-arm64-v8a-release-unsigned.apk"
          test -f "$flow_apk"
          entries="$(unzip -Z1 "$flow_apk")"
          for library in libmpv.so libplayer.so libplacebo.so libudfread.so libmedia3flow_vulkan.so libffmpegJNI.so libmedia3_subtitle_libass.so libass.so; do
            grep -Fx "lib/arm64-v8a/$library" <<< "$entries" >/dev/null || { echo "Flow arm64 release APK is missing $library" >&2; exit 1; }
          done
          if grep -E '^lib/[^/]+/librife_vfi\.so$' <<< "$entries" >/dev/null; then
            echo "RIFE native library unexpectedly present" >&2; exit 1
          fi
          echo "Standard arm64-v8a release rebuilt with the cached Flow-only MPVFlow runtime."

      - name: Sign APKs when signing secrets are available
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"

          test -x "$apksigner"

          if [[ -z "${{ secrets.SIGNING_KEYSTORE }}" ]]; then
            echo "SIGNING_KEYSTORE is unavailable (expected for untrusted fork PRs); keeping CI APKs unsigned."
            exit 0
          fi

          if [[ -z "${{ secrets.SIGNING_KEY_ALIAS }}" || -z "${{ secrets.SIGNING_STORE_PASSWORD }}" || -z "${{ secrets.KEY_PASSWORD }}" ]]; then
            echo "SIGNING_KEYSTORE exists but one or more required signing secrets are missing."
            exit 1
          fi

          printf '%s' "${{ secrets.SIGNING_KEYSTORE }}" | base64 --decode > release.keystore
          trap 'rm -f release.keystore' EXIT

          sign_apk() {
            local unsigned="$1"
            local signed="$2"
            local label="$3"
            if [[ ! -f "$unsigned" ]]; then
              echo "Missing expected $label APK: $unsigned"
              find app/build/outputs/apk -type f -name '*.apk' -print || true
              exit 1
            fi

            "$apksigner" sign \
              --ks release.keystore \
              --ks-key-alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
              --ks-pass "pass:${{ secrets.SIGNING_STORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              --out "$signed" \
              "$unsigned"
            "$apksigner" verify --verbose "$signed"
            rm -f "$unsigned"
          }

          if [[ "$SELECTED_FLAVOR" == "all" || "$SELECTED_FLAVOR" == "standard" ]]; then
            release_dir="app/build/outputs/apk/standard/release"
            test -d "$release_dir"
            if [[ "$ARM64_ONLY" == "true" ]]; then architectures=(arm64-v8a); else architectures=(universal arm64-v8a armeabi-v7a x86 x86_64); fi
            for abi in "${architectures[@]}"; do
              sign_apk \
                "$release_dir/app-standard-${abi}-release-unsigned.apk" \
                "$release_dir/app-standard-${abi}-release.apk" \
                "standard $abi release"
            done
          fi

          if [[ "$SELECTED_FLAVOR" == "all" || "$SELECTED_FLAVOR" == "no_vulkan" ]]; then
            flavor="noVulkan"
            flavor_dir="app/build/outputs/apk/noVulkan/release"
            test -d "$flavor_dir"
            sign_apk \
              "$flavor_dir/app-${flavor}-universal-release-unsigned.apk" \
              "$flavor_dir/app-${flavor}-universal-release.apk" \
              "non-Vulkan universal release"
          fi

      - name: Verify expected flavor outputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SELECTED_FLAVOR" == "all" || "$SELECTED_FLAVOR" == "standard" ]]; then
            release_dir="app/build/outputs/apk/standard/release"
            if [[ "$ARM64_ONLY" == "true" ]]; then architectures=(arm64-v8a); else architectures=(universal arm64-v8a armeabi-v7a x86 x86_64); fi
            for abi in "${architectures[@]}"; do
              if ! compgen -G "$release_dir/app-standard-${abi}-release*.apk" >/dev/null; then
                echo "No standard release APK found for $abi"
                exit 1
              fi
            done
          fi

          if [[ "$SELECTED_FLAVOR" == "all" || "$SELECTED_FLAVOR" == "no_vulkan" ]]; then
            flavor="noVulkan"
            flavor_dir="app/build/outputs/apk/noVulkan/release"
            if ! compgen -G "$flavor_dir/app-${flavor}-universal-release*.apk" >/dev/null; then
              echo "No universal non-Vulkan release APK found"
              exit 1
            fi
            if find "$flavor_dir" -maxdepth 1 -type f -name "app-${flavor}-*-release*.apk" ! -name "app-${flavor}-universal-release*.apk" | grep -q .; then
              echo "The non-Vulkan flavor produced an unexpected ABI-specific APK"
              find "$flavor_dir" -maxdepth 1 -type f -name '*.apk' -print
              exit 1
            fi
          fi

      - name: Upload arm64-v8a APK
        if: ${{ env.SELECTED_FLAVOR == 'all' || env.SELECTED_FLAVOR == 'standard' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-standard-arm64-v8a-release-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/app-standard-arm64-v8a-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload armeabi-v7a APK
        if: ${{ env.ARM64_ONLY != 'true' && (env.SELECTED_FLAVOR == 'all' || env.SELECTED_FLAVOR == 'standard') }}
        uses: actions/upload-artifact@v7
        with:
          name: app-standard-armeabi-v7a-release-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/app-standard-armeabi-v7a-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload universal APK
        if: ${{ env.ARM64_ONLY != 'true' && (env.SELECTED_FLAVOR == 'all' || env.SELECTED_FLAVOR == 'standard') }}
        uses: actions/upload-artifact@v7
        with:
          name: app-standard-universal-release-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/app-standard-universal-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload x86 APK
        if: ${{ env.ARM64_ONLY != 'true' && (env.SELECTED_FLAVOR == 'all' || env.SELECTED_FLAVOR == 'standard') }}
        uses: actions/upload-artifact@v7
        with:
          name: app-standard-x86-release-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/app-standard-x86-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload x86_64 APK
        if: ${{ env.ARM64_ONLY != 'true' && (env.SELECTED_FLAVOR == 'all' || env.SELECTED_FLAVOR == 'standard') }}
        uses: actions/upload-artifact@v7
        with:
          name: app-standard-x86_64-release-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/app-standard-x86_64-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload non-Vulkan universal APK
        if: ${{ env.SELECTED_FLAVOR == 'all' || env.SELECTED_FLAVOR == 'no_vulkan' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-no-vulkan-release-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/noVulkan/release/app-noVulkan-universal-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
