name: CI/CD Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      build_flavor:
        description: APK flavor to build
        required: true
        default: standard
        type: choice
        options:
          - standard
          - all
          - dual
          - fongmi
          - no_vulkan
      build_type:
        description: Build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SELECTED_FLAVOR: ${{ inputs.build_flavor || 'standard' }}
  BUILD_TYPE: ${{ inputs.build_type || 'debug' }}

jobs:
  build:
    name: Build selected APK flavors
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # BuildConfig.GIT_COUNT and preview build identities rely on the real repository history.
          fetch-depth: 0

      - name: Generate build metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "COMMIT_COUNT=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build selected APKs
        shell: bash
        run: |
          set -euo pipefail
          gradle_suffix="Debug"
          if [[ "$BUILD_TYPE" == "release" ]]; then
            gradle_suffix="Release"
          fi
          if [[ "$SELECTED_FLAVOR" == "all" || "$SELECTED_FLAVOR" == "dual" || "$SELECTED_FLAVOR" == "standard" ]]; then
            ./gradlew "assembleStandard${gradle_suffix}" --stacktrace --no-daemon --max-workers=2
          fi
          if [[ "$SELECTED_FLAVOR" == "all" || "$SELECTED_FLAVOR" == "dual" || "$SELECTED_FLAVOR" == "fongmi" ]]; then
            ./gradlew "assembleFongmi${gradle_suffix}" --stacktrace --no-daemon --max-workers=2
          fi
          if [[ "$SELECTED_FLAVOR" == "all" || "$SELECTED_FLAVOR" == "no_vulkan" ]]; then
            ./gradlew "assembleNoVulkan${gradle_suffix}" --stacktrace --no-daemon --max-workers=2
          fi

      - name: Sign APKs when signing secrets are available
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"

          test -x "$apksigner"

          if [[ -z "${{ secrets.SIGNING_KEYSTORE }}" ]]; then
            if [[ "$BUILD_TYPE" == "release" ]]; then
              echo "SIGNING_KEYSTORE is required for a stable release build."
              exit 1
            fi
            echo "SIGNING_KEYSTORE is unavailable (expected for untrusted fork PRs); keeping debug CI APKs unsigned."
            exit 0
          fi

          if [[ -z "${{ secrets.SIGNING_KEY_ALIAS }}" || -z "${{ secrets.SIGNING_STORE_PASSWORD }}" || -z "${{ secrets.KEY_PASSWORD }}" ]]; then
            echo "SIGNING_KEYSTORE exists but one or more required signing secrets are missing."
            exit 1
          fi

          printf '%s' "${{ secrets.SIGNING_KEYSTORE }}" | base64 --decode > release.keystore
          trap 'rm -f release.keystore' EXIT

          sign_apk() {
            local unsigned="$1"
            local signed="$2"
            local label="$3"
            if [[ -f "$unsigned" ]]; then
              "$apksigner" sign \
                --ks release.keystore \
                --ks-key-alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
                --ks-pass "pass:${{ secrets.SIGNING_STORE_PASSWORD }}" \
                --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
                --out "$signed" \
                "$unsigned"
              rm -f "$unsigned"
            elif [[ -f "$signed" ]]; then
              # Gradle may emit a debug-signed APK directly instead of an
              # explicit -unsigned APK. Re-sign that file in place for CI.
              temporary="${signed}.resigned"
              "$apksigner" sign \
                --ks release.keystore \
                --ks-key-alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
                --ks-pass "pass:${{ secrets.SIGNING_STORE_PASSWORD }}" \
                --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
                --out "$temporary" \
                "$signed"
              mv -f "$temporary" "$signed"
            else
              echo "Missing expected $label APK: neither $unsigned nor $signed exists"
              find app/build/outputs/apk -type f -name '*.apk' -print || true
              exit 1
            fi
            "$apksigner" verify --verbose "$signed"
          }

          if [[ "$SELECTED_FLAVOR" == "all" || "$SELECTED_FLAVOR" == "dual" || "$SELECTED_FLAVOR" == "standard" ]]; then
            release_dir="app/build/outputs/apk/standard/$BUILD_TYPE"
            test -d "$release_dir"
            architectures=(universal arm64-v8a armeabi-v7a x86 x86_64)
            for abi in "${architectures[@]}"; do
              sign_apk \
                "$release_dir/app-standard-${abi}-${BUILD_TYPE}-unsigned.apk" \
                "$release_dir/app-standard-${abi}-${BUILD_TYPE}.apk" \
                "standard $abi release"
            done
          fi

          if [[ "$SELECTED_FLAVOR" == "all" || "$SELECTED_FLAVOR" == "dual" || "$SELECTED_FLAVOR" == "fongmi" ]]; then
            flavor="fongmi"
            flavor_dir="app/build/outputs/apk/fongmi/$BUILD_TYPE"
            test -d "$flavor_dir"
            sign_apk \
              "$flavor_dir/app-${flavor}-universal-${BUILD_TYPE}-unsigned.apk" \
              "$flavor_dir/app-${flavor}-universal-${BUILD_TYPE}.apk" \
              "$flavor universal release"
          fi

          if [[ "$SELECTED_FLAVOR" == "all" || "$SELECTED_FLAVOR" == "no_vulkan" ]]; then
            flavor="noVulkan"
            flavor_dir="app/build/outputs/apk/noVulkan/$BUILD_TYPE"
            test -d "$flavor_dir"
            sign_apk \
              "$flavor_dir/app-${flavor}-universal-${BUILD_TYPE}-unsigned.apk" \
              "$flavor_dir/app-${flavor}-universal-${BUILD_TYPE}.apk" \
              "non-Vulkan universal release"
          fi

      - name: Verify expected flavor outputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SELECTED_FLAVOR" == "all" || "$SELECTED_FLAVOR" == "dual" || "$SELECTED_FLAVOR" == "standard" ]]; then
            release_dir="app/build/outputs/apk/standard/$BUILD_TYPE"
            architectures=(universal arm64-v8a armeabi-v7a x86 x86_64)
            for abi in "${architectures[@]}"; do
              if ! compgen -G "$release_dir/app-standard-${abi}-${BUILD_TYPE}*.apk" >/dev/null; then
                echo "No standard release APK found for $abi"
                exit 1
              fi
            done
          fi

          if [[ "$SELECTED_FLAVOR" == "all" || "$SELECTED_FLAVOR" == "dual" || "$SELECTED_FLAVOR" == "fongmi" ]]; then
            flavor="fongmi"
            flavor_dir="app/build/outputs/apk/fongmi/$BUILD_TYPE"
            if ! compgen -G "$flavor_dir/app-${flavor}-universal-${BUILD_TYPE}*.apk" >/dev/null; then
              echo "No universal release APK found for $flavor"
              exit 1
            fi
            if find "$flavor_dir" -maxdepth 1 -type f -name "app-${flavor}-*-${BUILD_TYPE}*.apk" ! -name "app-${flavor}-universal-${BUILD_TYPE}*.apk" | grep -q .; then
              echo "$flavor produced an unexpected ABI-specific APK"
              find "$flavor_dir" -maxdepth 1 -type f -name '*.apk' -print
              exit 1
            fi
          fi

          if [[ "$SELECTED_FLAVOR" == "all" || "$SELECTED_FLAVOR" == "no_vulkan" ]]; then
            flavor="noVulkan"
            flavor_dir="app/build/outputs/apk/noVulkan/$BUILD_TYPE"
            if ! compgen -G "$flavor_dir/app-${flavor}-universal-${BUILD_TYPE}*.apk" >/dev/null; then
              echo "No universal non-Vulkan release APK found"
              exit 1
            fi
            if find "$flavor_dir" -maxdepth 1 -type f -name "app-${flavor}-*-${BUILD_TYPE}*.apk" ! -name "app-${flavor}-universal-${BUILD_TYPE}*.apk" | grep -q .; then
              echo "The non-Vulkan flavor produced an unexpected ABI-specific APK"
              find "$flavor_dir" -maxdepth 1 -type f -name '*.apk' -print
              exit 1
            fi
          fi

      - name: List Standard debug APK variants
        if: ${{ env.SELECTED_FLAVOR == 'standard' || env.SELECTED_FLAVOR == 'dual' || env.SELECTED_FLAVOR == 'all' }}
        shell: bash
        run: find app/build/outputs/apk/standard/$BUILD_TYPE -maxdepth 1 -type f -name "app-standard-*-$BUILD_TYPE.apk" -print

      - name: Upload Standard debug universal APK
        if: ${{ env.SELECTED_FLAVOR == 'standard' || env.SELECTED_FLAVOR == 'dual' || env.SELECTED_FLAVOR == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: mpv-infinity-standard-${{ env.BUILD_TYPE }}-universal-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/${{ env.BUILD_TYPE }}/app-standard-universal-${{ env.BUILD_TYPE }}.apk
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Standard debug arm64-v8a APK
        if: ${{ env.SELECTED_FLAVOR == 'standard' || env.SELECTED_FLAVOR == 'dual' || env.SELECTED_FLAVOR == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: mpv-infinity-standard-${{ env.BUILD_TYPE }}-arm64-v8a-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/${{ env.BUILD_TYPE }}/app-standard-arm64-v8a-${{ env.BUILD_TYPE }}.apk
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Standard debug armeabi-v7a APK
        if: ${{ env.SELECTED_FLAVOR == 'standard' || env.SELECTED_FLAVOR == 'dual' || env.SELECTED_FLAVOR == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: mpv-infinity-standard-${{ env.BUILD_TYPE }}-armeabi-v7a-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/${{ env.BUILD_TYPE }}/app-standard-armeabi-v7a-${{ env.BUILD_TYPE }}.apk
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Standard debug x86 APK
        if: ${{ env.SELECTED_FLAVOR == 'standard' || env.SELECTED_FLAVOR == 'dual' || env.SELECTED_FLAVOR == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: mpv-infinity-standard-${{ env.BUILD_TYPE }}-x86-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/${{ env.BUILD_TYPE }}/app-standard-x86-${{ env.BUILD_TYPE }}.apk
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Standard debug x86_64 APK
        if: ${{ env.SELECTED_FLAVOR == 'standard' || env.SELECTED_FLAVOR == 'dual' || env.SELECTED_FLAVOR == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: mpv-infinity-standard-${{ env.BUILD_TYPE }}-x86_64-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/${{ env.BUILD_TYPE }}/app-standard-x86_64-${{ env.BUILD_TYPE }}.apk
          if-no-files-found: ignore
          retention-days: 7
