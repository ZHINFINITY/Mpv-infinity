name: Generate baseline profile

on:
  push:
    branches:
      - 'baseline-profile/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate Standard x86_64 baseline profile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install native subtitle build dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool gettext autopoint gperf pkg-config

      - name: Verify native subtitle build tools
        run: |
          set -euo pipefail
          export PATH="/usr/bin:/usr/local/bin:$PATH"
          autopoint --version
          autoreconf --version
          echo "/usr/bin" >> "$GITHUB_PATH"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # The Baseline Profile Gradle plugin builds the benchmark variant,
      # installs it on the connected emulator, runs the macrobenchmark journey,
      # and writes a human-readable profile into app/src/.../generated.
      - name: Generate Standard release baseline profile on API 35 x86_64
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          disk-size: 8G
          force-avd-creation: true
          emulator-options: -no-window -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ./gradlew :app:generateStandardReleaseBaselineProfile -PtargetAbi=x86_64 --no-daemon --stacktrace --max-workers=3
            profile="$(find app/src -type f -path '*/generated/baselineProfiles/*' | head -n 1)"
            test -n "$profile" && test -s "$profile"
            grep -q 'Lapp/infinity/mpvz/' "$profile"
            mkdir -p baseline-profile-artifact
            cp "$profile" baseline-profile-artifact/
            echo "Generated $profile ($(wc -l < "$profile") lines)"

      - name: Upload generated profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-profile
          path: |
            baseline-profile-artifact/**
          if-no-files-found: error
          retention-days: 14
