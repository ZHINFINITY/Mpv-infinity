name: Generate baseline profile

on:
  push:
    branches:
      - 'baseline-profile/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate Standard x86_64 baseline profile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # The AAR and libtorrent4j both publish x86_64 native libraries. Keeping
      # this explicit prevents the default multi-ABI build from wasting runner
      # time and ensures the emulator executes the same native code it profiles.
      - name: Build Standard release for the emulator
        run: ./gradlew :app:assembleStandardRelease -PtargetAbi=x86_64 --stacktrace --no-daemon --max-workers=3

      - name: Run baseline profile journeys on API 35 x86_64
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          disk-size: 8G
          force-avd-creation: true
          emulator-options: -no-window -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ./gradlew :baselineprofile:connectedStandardReleaseAndroidTest --stacktrace --no-daemon --max-workers=3
            adb root || true
            adb wait-for-device
            mkdir -p baseline-profile-artifact
            found=""
            for candidate in \
              /data/misc/profiles/ref/app.infinity.mpvz/primary.prof \
              /data/misc/profiles/cur/0/app.infinity.mpvz/primary.prof; do
              if adb shell "test -s '$candidate'" >/dev/null 2>&1; then
                found="$candidate"
                break
              fi
            done
            if [ -z "$found" ]; then
              echo 'No ART profile found after BaselineProfileRule; dumping profile directories.'
              adb shell 'find /data/misc/profiles -type f -maxdepth 5 2>/dev/null || true'
              exit 1
            fi
            adb pull "$found" baseline-profile-artifact/primary.prof
            profman=""
            for candidate in "$ANDROID_HOME/build-tools/35.0.0/profman" "$ANDROID_HOME/build-tools/34.0.0/profman"; do
              if [ -x "$candidate" ]; then profman="$candidate"; break; fi
            done
            if [ -n "$profman" ]; then
              "$profman" --dump-classes-and-methods --profile-file=baseline-profile-artifact/primary.prof > baseline-profile-artifact/baseline-prof.txt
              test -s baseline-profile-artifact/baseline-prof.txt
              cp baseline-profile-artifact/baseline-prof.txt baseline-prof-generated.txt
            else
              echo 'profman is unavailable on this runner; preserving binary profile artifact.'
            fi

      - name: Upload generated profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-profile-${{ github.sha }}
          path: |
            baseline-profile-artifact/**
            baseline-prof-generated.txt
          if-no-files-found: error
          retention-days: 14
