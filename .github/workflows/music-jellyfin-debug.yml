name: Music and Jellyfin arm64 Debug

on:
  push:
    branches:
      - music-jellyfin-debug
      - manus/source-base-media3-port
      - manus/native-auto-engine-fix
      - fix/music-player-lag
      - fix/v220-music-glass
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: music-jellyfin-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64-debug:
    name: Build Standard arm64-v8a Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out the stable-v1.0.3-based branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Restore verified Flow-only MPVFlow arm64 runtime
        id: mpvflow-runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: native-builder/app/build/outputs/apk
          key: mpvflow-arm64-runtime-v2-builder-1efc82739f6f7034-mpv-c1529642089bfebf-cores2-${{ hashFiles('scripts/build-mpvflow-mpv-runtime.sh', 'scripts/prepare-mpvflow.py', 'scripts/patch-ffmpeg-symver.py', 'app/src/main/cpp/**', 'THIRD_PARTY_LICENSES/**', 'app/src/main/assets/mpv/licenses/**') }}

      - name: Use cached Flow-only MPVFlow arm64 runtime
        if: ${{ steps.mpvflow-runtime-cache.outputs.cache-hit == 'true' }}
        run: |
          set -euo pipefail
          runtime_dir="$GITHUB_WORKSPACE/native-builder/app/build/outputs/apk"
          [[ -d "$runtime_dir" ]] || { echo "Cached MPVFlow runtime path is missing: $runtime_dir" >&2; exit 1; }
          apk="$(find "$runtime_dir" -type f -path '*/debug/*' -name '*arm64-v8a-debug*.apk' -print -quit)"
          [[ -n "$apk" ]] || { echo "Cached MPVFlow arm64 runtime APK is missing" >&2; exit 1; }
          echo "MPVFLOW_RUNTIME_APK=$apk" >> "$GITHUB_ENV"
          echo "Using verified cached MPVFlow runtime APK: $apk"

      - name: Overlay Flow-only runtime into Standard MPV AAR
        if: ${{ steps.mpvflow-runtime-cache.outputs.cache-hit == 'true' }}
        run: python3 scripts/package-mpv-runtime-aar.py --runtime-apk "$MPVFLOW_RUNTIME_APK" --mpv-aar app/libs/mpvlib.aar --abis arm64-v8a

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;35.0.0 cmake;3.22.1 ndk;27.3.13750724'

      - name: Install libass native build dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool gettext autopoint gperf pkg-config

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build only Standard arm64-v8a Debug
        run: |
          FLOW_ARGS=""
          if [[ "${{ steps.mpvflow-runtime-cache.outputs.cache-hit }}" == "true" ]]; then
            FLOW_ARGS="-PmpvFlowMpvBuild=true"
          fi
          ./gradlew :app:assembleStandardDebug -PtargetAbi=arm64-v8a $FLOW_ARGS --no-daemon --max-workers=2 --stacktrace

      - name: Verify only the requested APK is present
        shell: bash
        run: |
          set -euo pipefail
          output_dir="app/build/outputs/apk/standard/debug"
          apk="$output_dir/app-standard-arm64-v8a-debug.apk"
          test -f "$apk"
          if find "$output_dir" -maxdepth 1 -type f -name '*.apk' ! -name 'app-standard-arm64-v8a-debug.apk' | grep -q .; then
            echo 'Unexpected additional APK output:'
            find "$output_dir" -maxdepth 1 -type f -name '*.apk' -print
            exit 1
          fi
          sha256sum "$apk" | tee "$output_dir/SHA256SUMS.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$apk" | grep -E "package:|native-code"

      - name: Upload private CI artifact for device testing
        uses: actions/upload-artifact@v4
        with:
          name: mpv-infinity-music-jellyfin-standard-arm64-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/standard/debug/app-standard-arm64-v8a-debug.apk
            app/build/outputs/apk/standard/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
